name: Build, deploy, and publish ImageFit

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: imagefit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type check and build web app
        run: pnpm build

      - name: Deploy web app
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------
          # Linux
          # -------------------------
          - name: Linux
            os: ubuntu-latest
            command: pnpm desktop:package:linux
            artifact: imagefit-desktop-linux
            installer: release/*.AppImage
            path: |
              release/*.AppImage
              release/latest*.yml
              release/*.blockmap

          # -------------------------
          # macOS Apple Silicon
          # -------------------------
          - name: macOS Apple Silicon
            os: macos-latest
            command: pnpm desktop:package:mac -- --arm64
            artifact: imagefit-desktop-macos-arm64
            installer: release/*arm64*.dmg
            path: |
              release/*arm64*.dmg
              release/*arm64*.zip
              release/latest*.yml
              release/*.blockmap

          # -------------------------
          # macOS Intel
          # -------------------------
          - name: macOS Intel
            os: macos-15-intel
            command: pnpm desktop:package:mac -- --x64
            artifact: imagefit-desktop-macos-x64
            installer: release/*x64*.dmg
            path: |
              release/*x64*.dmg
              release/*x64*.zip
              release/latest*.yml
              release/*.blockmap

          # -------------------------
          # Windows
          # -------------------------
          - name: Windows
            os: windows-latest
            command: pnpm desktop:package:win
            artifact: imagefit-desktop-windows
            installer: release/*.exe
            path: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CSC_LINK must be left unset rather than set to an empty string.
      #
      # electron-builder treats an empty CSC_LINK as a certificate path,
      # which results in an error such as:
      #
      # "<projectDir> not a file"
      #
      # Therefore we only export CSC_LINK when an actual certificate secret
      # is present.
      - name: Build desktop app
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            Windows)
              certificate="$WINDOWS_CERTIFICATE"
              password="$WINDOWS_CERTIFICATE_PASSWORD"
              ;;

            "macOS Apple Silicon"|"macOS Intel")
              certificate="$APPLE_CERTIFICATE"
              password="$APPLE_CERTIFICATE_PASSWORD"
              ;;

            *)
              certificate=""
              password=""
              ;;
          esac

          if [ -n "$certificate" ]; then
            echo "Using code-signing certificate for ${{ matrix.name }}."

            export CSC_LINK="$certificate"
            export CSC_KEY_PASSWORD="$password"
          else
            echo "No code-signing certificate for ${{ matrix.name }}; building unsigned."

            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          echo "Building ${{ matrix.name }}..."
          echo "Command: ${{ matrix.command }}"

          ${{ matrix.command }}

      - name: Show release files
        shell: bash
        run: |
          echo "Files produced in release/:"
          find release -maxdepth 1 -type f -print | sort

      # electron-builder omits the arch from the filename for the default arch (x64), so an
      # upload glob containing an arch token can quietly match nothing. The artifact upload
      # below cannot catch that on its own: `if-no-files-found: error` is still satisfied by
      # the .yml/.blockmap patterns, so the job goes green with no installer in it. Fail here
      # instead, where the message points at the actual cause.
      - name: Verify the installer was produced
        shell: bash
        run: |
          shopt -s nullglob
          matches=(${{ matrix.installer }})

          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No file matched '${{ matrix.installer }}'. The ${{ matrix.name }} installer was not produced under the expected name, so it would be left out of the release."
            exit 1
          fi

          echo "Matched ${#matches[@]} installer file(s) for ${{ matrix.name }}:"
          printf '  %s\n' "${matches[@]}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop release

    if: startsWith(github.ref, 'refs/tags/')

    needs: desktop

    runs-on: ubuntu-latest

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: imagefit-desktop-*
          merge-multiple: true

      - name: Show downloaded release files
        shell: bash
        run: |
          echo "Files downloaded for GitHub release:"
          find . -maxdepth 1 -type f -print | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.exe
            *.dmg
            *.zip
            *.yml
            *.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
