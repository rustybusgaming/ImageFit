name: Build, deploy, and publish ImageFit

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: imagefit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type check and build web app
        run: pnpm build

      - name: Deploy web app
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: pnpm desktop:package:linux
            artifact: imagefit-desktop-linux
            path: |
              release/*.AppImage
              release/*.yml
              release/*.blockmap

          - name: macOS Apple Silicon
            os: macos-latest
            command: pnpm desktop:package:mac -- --arm64
            artifact: imagefit-desktop-macos-arm64
            path: |
              release/*arm64*.dmg
              release/*arm64*.zip
              release/*.yml
              release/*.blockmap

          - name: macOS Intel
            os: macos-latest
            command: pnpm desktop:package:mac -- --x64
            artifact: imagefit-desktop-macos-x64
            path: |
              release/*x64*.dmg
              release/*x64*.zip
              release/*.yml
              release/*.blockmap

          - name: Windows
            os: windows-latest
            command: pnpm desktop:package:win
            artifact: imagefit-desktop-windows
            path: |
              release/*.exe
              release/*.yml
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CSC_LINK must be left unset rather than set to an empty string:
      # electron-builder reads an empty value as a certificate path,
      # resolves it against the project directory and fails with:
      # "<projectDir> not a file".
      #
      # The signing variables are therefore exported from the shell only
      # when a certificate secret actually exists.
      - name: Build desktop app
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            Windows)
              certificate="$WINDOWS_CERTIFICATE"
              password="$WINDOWS_CERTIFICATE_PASSWORD"
              ;;

            "macOS Apple Silicon"|"macOS Intel")
              certificate="$APPLE_CERTIFICATE"
              password="$APPLE_CERTIFICATE_PASSWORD"
              ;;

            *)
              certificate=""
              password=""
              ;;
          esac

          if [ -n "$certificate" ]; then
            export CSC_LINK="$certificate"
            export CSC_KEY_PASSWORD="$password"
          else
            echo "No code-signing certificate for ${{ matrix.name }}; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          ${{ matrix.command }}
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  publish-desktop:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: imagefit-desktop-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.exe
            *.dmg
            *.zip
            *.yml
            *.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
